<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Memorare Ioan 14-16</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --gold: #facc15;
            --success: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }

        /* HEADER */
        header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .subtitle { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        /* INFO BOX */
        .info-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            display: inline-flex;
            flex-direction: column;
            gap: 10px;
            min-width: 280px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .info-row { display: flex; align-items: center; gap: 12px; justify-content: center; }
        .info-icon { color: var(--accent); font-size: 1.1rem; }
        .info-content { text-align: left; }
        .info-label { display: block; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-text { display: block; color: #fff; font-weight: 700; font-size: 0.95rem; }

        /* BUTOANE RESURSE */
        .resources-row { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .resource-btn {
            text-decoration: none; flex: 1; max-width: 140px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 8px; text-align: center; transition: all 0.2s;
        }
        .resource-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        .res-icon { font-size: 1.2rem; display: block; margin-bottom: 2px; }
        .res-text { color: #fff; font-size: 0.75rem; font-weight: 600; }

        /* SECTIUNI */
        .section-label {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
            margin-bottom: 10px; font-weight: 700; display: flex; align-items: center; gap: 5px;
        }

        /* CARDURI GENERALE */
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 25px; }

        /* --- MANA CARD (REDESIGN: DARK & GOLD) --- */
        .mana-card {
            background: #172033;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .mana-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--accent), var(--gold));
        }

        .big-number { font-size: 3.5rem; font-weight: 800; line-height: 1; margin: 10px 0; color: #fff; }
        .target-text { font-size: 0.9rem; color: var(--text-dim); }

        /* Bara de progres MANA */
        .mana-progress-track {
            background: rgba(255,255,255,0.1);
            height: 12px;
            border-radius: 6px;
            margin-top: 15px;
            overflow: hidden;
        }
        .mana-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #facc15, #fbbf24);
            border-radius: 6px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        /* TEAM CARDS */
        .teams-grid { display: grid; gap: 15px; grid-template-columns: 1fr; }
        @media(min-width: 600px) { .teams-grid { grid-template-columns: 1fr 1fr; } }

        .team-card { display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
        .team-meta { display: flex; justify-content: space-between; align-items: flex-end; }

        /* Aici e modificarea pentru scorul echipei */
        .team-score { font-size: 1.8rem; font-weight: 800; line-height: 1; color: #fff; }
        .team-target-label { font-size: 0.8rem; color: var(--text-dim); }

        .team-avatars { display: flex; margin-bottom: 5px; }
        .t-avatar { width: 45px; height: 45px; border-radius: 50%; border: 3px solid var(--card); margin-left: -10px; }
        .t-avatar:first-child { margin-left: 0; }
        .team-msg { font-size: 0.85rem; color: var(--gold); font-weight: 600; margin-top: 5px; }

        .progress-container { background: rgba(0,0,0,0.3); height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 1s ease; border-radius: 5px; }
        .bg-green { background: var(--success); }

        /* INDIVIDUAL */
        .user-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .user-left { display: flex; align-items: center; gap: 10px; }
        .u-avatar { width: 35px; height: 35px; border-radius: 50%; background: #334155; }
        .u-name { font-weight: 600; font-size: 0.95rem; }
        .u-badges { margin-left: 5px; font-size: 1rem; vertical-align: middle; }
        .u-stats { text-align: right; }
        .u-val { font-weight: 700; font-size: 1rem; color: var(--text); }

        .u-bar-track {
            width: 120px;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            margin-top: 6px;
            margin-left: auto;
            overflow: hidden;
        }
        .u-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s ease; }

        .loading { text-align: center; padding: 40px; color: var(--text-dim); }

        /* --- MARKERE CAPITOLE (MILESTONES) --- */
        .u-bar-track, .mana-progress-track, .progress-container { position: relative; }
        .milestone { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.6); z-index: 5; box-shadow: 0 0 3px rgba(0,0,0,0.5); }
        .m-c14 { left: 34%; }   /* 31 din 91 versete */
        .m-c15 { left: 63.7%; } /* 58 din 91 versete */

        /* --- MODAL ANTRENAMENT --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 1000;
            display: flex; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-card {
            background: var(--card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-btn { background: none; border: none; color: var(--text-dim); font-size: 1.5rem; cursor: pointer; }
        .modal-controls { display: flex; gap: 10px; padding: 15px 20px; background: rgba(0,0,0,0.2); }
        .ctrl-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .ctrl-btn.active { background: var(--accent); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; font-size: 1.1rem; line-height: 1.6; }
        .verse-block { margin-bottom: 15px; }
        .v-num { font-weight: bold; color: var(--accent); margin-right: 5px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Ioan 14-16</h1>
        <div class="subtitle" id="week-badge">Săptămâna ...</div>

        <div class="info-box">
            <div class="info-row">
                <i class="ri-book-open-line info-icon"></i>
                <div class="info-content">
                    <span class="info-label">De învățat:</span>
                    <span class="info-text" id="passage-badge">...</span>
                </div>
            </div>
            <div class="info-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                <i class="ri-calendar-event-line info-icon" style="color:#facc15"></i>
                <div class="info-content">
                    <span class="info-label">Ne vedem:</span>
                    <span class="info-text" id="date-badge">...</span>
                </div>
            </div>
        </div>

        <div class="resources-row">
            <button onclick="openModal()" class="resource-btn" style="cursor:pointer; font-family: inherit;">
                <i class="ri-lightbulb-flash-line res-icon" style="color:#10b981"></i>
                <span class="res-text">Antrenament</span>
            </button>
            <a href="https://drive.google.com/file/d/1O74B1Nl0pEadZ8O_f9DN1NyuV41d_o3W/view" target="_blank" class="resource-btn">
                <i class="ri-book-read-line res-icon" style="color:#60a5fa"></i>
                <span class="res-text">Citește</span>
            </a>
            <a href="https://biblia.resursecrestine.ro/ioan/14" target="_blank" class="resource-btn">
                <i class="ri-headphone-line res-icon" style="color:#facc15"></i>
                <span class="res-text">Ascultă</span>
            </a>
        </div>
    </header>

    <div class="section-label"><i class="ri-flag-fill"></i> Obiectivul Total</div>
    <div class="card mana-card" id="mana-container">
        <div class="loading">Se calculează totalul...</div>
    </div>

    <div class="section-label" id="team-strategy-label"><i class="ri-group-fill"></i> Echipe</div>
    <div class="teams-grid" id="teams-grid">
    </div>

    <div class="section-label" style="margin-top: 30px;"><i class="ri-user-smile-fill"></i> Progres Individual</div>
    <div class="card" style="padding: 10px 20px;">
        <div id="individual-list">
        </div>
    </div>

    <div id="antrenament-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="ri-brain-line"></i> Antrenament</h3>
                <button class="close-btn" onclick="closeModal()"><i class="ri-close-line"></i></button>
            </div>
            <div class="modal-controls" style="flex-wrap: wrap; gap: 10px;">
                <div style="width: 100%; display: flex; gap: 5px;">
                    <button class="ctrl-btn active" id="btn-c14" onclick="setChapter(14)" style="background: #3b82f6; border-color: #3b82f6;">Ioan 14</button>
                    <button class="ctrl-btn" id="btn-c15" onclick="setChapter(15)">Ioan 15</button>
                    <button class="ctrl-btn" id="btn-c16" onclick="setChapter(16)">Ioan 16</button>
                </div>
                <div style="width: 100%; display: flex; gap: 5px;">
                    <button class="ctrl-btn active" id="btn-normal" onclick="setMode('normal')" style="border-color: #94a3b8">Text Normal</button>
                    <button class="ctrl-btn" id="btn-litere" onclick="setMode('litere')" style="border-color: #facc15; color: #facc15">Prima Literă</button>
                </div>
            </div>
            <div class="modal-body" id="antrenament-text">
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURARE ---
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRdVFnXKKZrGCNZJtG5AcId2syvz8xuIXDLE6DW100lXWpodskdZoBxpNeNIndunbMrg2xlv7uMhq-n/pub?gid=0&single=true&output=csv';
    const TARGET_PER_PERSON = 91;

    // Configurare Praguri Coroane
    const THRESHOLD_C1 = 31;
    const THRESHOLD_C2 = 58;
    const THRESHOLD_C3 = 91;

    document.addEventListener('DOMContentLoaded', () => {
        fetchAndProcess();
    });

    async function fetchAndProcess() {
        try {
            const cacheBuster = '&t=' + new Date().getTime();
            const res = await fetch(SHEET_URL + cacheBuster, { cache: "no-store" });
            const csv = await res.text();
            const parsed = parseCSV(csv);
            processData(parsed);
        } catch(e) {
            console.error(e);
            document.querySelector('.container').innerHTML = `<h3 style="text-align:center;color:#ef4444;margin-top:50px">Eroare încărcare date.</h3>`;
        }
    }

    function parseCSV(csv) {
        const lines = csv.split("\n").filter(l => l.trim());
        const metaRow = lines[1].split(",");
        const weekNumber = parseInt(metaRow[2]) || 1;
        const passage = metaRow[3] ? metaRow[3].trim() : "Toate capitolele";
        const meetingDate = metaRow[4] ? metaRow[4].trim() : "Va fi anunțat";

        const users = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",");
            const nume = cols[0].trim();
            const total = parseInt(cols[1]) || 0;
            if(nume) users.push({ nume, total });
        }
        return { users, weekNumber, passage, meetingDate };
    }

    function processData({ users, weekNumber, passage, meetingDate }) {
        const isRandom = weekNumber % 2 === 1;
        const label = (weekNumber % 2 === 1) ? "ECHIPE RANDOM" : "ECHIPE SUPORT";

        document.getElementById('week-badge').innerText = `SĂPTĂMÂNA ${weekNumber} • ${label}`;
        document.getElementById('passage-badge').innerText = passage;
        document.getElementById('date-badge').innerText = meetingDate;

        renderMana(users);
        renderIndividual(users);
        const teams = generateTeams(users, (weekNumber % 2 === 1), weekNumber);
        renderTeams(teams);
    }

    function getBadges(total) {
        let b = '';
        if (total >= THRESHOLD_C1) b += '🔥';
        if (total >= THRESHOLD_C2) b += '👑';
        if (total >= THRESHOLD_C3) b += '💎';
        return b;
    }

    function renderMana(users) {
        const current = users.reduce((acc, u) => acc + u.total, 0);
        const target = users.length * TARGET_PER_PERSON;
        const percent = Math.min((current / target) * 100, 100);

        const html = `
            <div style="font-size:0.9rem; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px">Total Versete Învățate</div>
            <div class="big-number">${current}</div>
            <div class="target-text">din <b>${target}</b> necesare la nivel de grup</div>

            <div class="mana-progress-track">
                <div class="mana-progress-fill" style="width: ${percent}%"></div>
            </div>

            <div style="margin-top:12px; font-size:0.85rem; color:#fff">
                <span style="color:#facc15">★</span> Am parcurs <b>${Math.round(percent)}%</b> din text împreună!
            </div>
        `;
        document.getElementById('mana-container').innerHTML = html;
    }

    function renderTeams(teams) {
        let html = '';
        teams.forEach(members => {
            const currentTeam = members.reduce((acc, m) => acc + m.total, 0);
            const targetTeam = members.length * TARGET_PER_PERSON;
            const left = targetTeam - currentTeam;
            const percent = Math.min((currentTeam / targetTeam) * 100, 100);

            const names = members.map(m => m.nume.split(' ')[0]).join(' & ');
            let avatars = '';
            members.forEach(m => {
                avatars += `<img src="https://ui-avatars.com/api/?name=${m.nume}&background=random&color=fff&bold=true" class="t-avatar">`;
            });

            let msg = `Mai aveți de învățat <b>${left}</b> versete!`;
            if(left <= 0) msg = `✨ Echipă Completă! Felicitări!`;
            else if(percent > 80) msg = `Încă puțin! Doar <b>${left}</b> versete.`;

            html += `
                <div class="card team-card" style="margin-bottom:0">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <div class="team-avatars">${avatars}</div>
                        <div style="text-align:right">
                            <div style="font-weight:700; font-size:1rem">${names}</div>
                        </div>
                    </div>

                    <div style="margin-top:10px">
                        <div class="team-meta">
                            <span class="team-score">${Math.round(percent)}%</span>

                            <div style="text-align:right">
                                <span style="display:block; font-size:1.1rem; font-weight:bold; color:#fff; margin-bottom:-2px">
                                    ${currentTeam}
                                </span>
                                <span class="team-target-label">din ${targetTeam}</span>
                            </div>
                        </div>
                        <div class="progress-container" style="background:rgba(255,255,255,0.05)">
                            <div class="progress-fill bg-green" style="width: ${percent}%"></div>
                        </div>
                        <div class="team-msg">${msg}</div>
                    </div>
                </div>
            `;
        });
        document.getElementById('teams-grid').innerHTML = html;
    }

    function renderIndividual(users) {
        const sorted = [...users].sort((a, b) => a.nume.localeCompare(b.nume));
        let html = '';
        sorted.forEach(u => {
            const percent = Math.min((u.total / TARGET_PER_PERSON) * 100, 100);
            const badges = getBadges(u.total);

            const lastVerse = getLastVerse(u.total);

            html += `
                <div class="user-row">
                    <div class="user-left">
                        <img src="https://ui-avatars.com/api/?name=${u.nume}&background=0f172a&color=fff" class="u-avatar">

                        <div style="display:flex; flex-direction:column; justify-content:center; margin-left: 10px;">
                            <span class="u-name">
                                ${u.nume}
                                <span class="u-badges">${badges}</span>
                            </span>
                            <span style="font-size: 0.75rem; color: #64748b; margin-top: 2px;">
                                Ultimul verset: ${lastVerse}
                            </span>
                        </div>
                    </div>

                    <div class="u-stats">
                        <div class="u-val">${u.total} <span style="font-size:0.7rem; font-weight:400; color:#64748b">/ ${TARGET_PER_PERSON}</span></div>
                        <div class="u-bar-track">
                            <div class="milestone m-c14" title="Final Ioan 14"></div>
                            <div class="milestone m-c15" title="Final Ioan 15"></div>
                            <div class="u-bar-fill" style="width:${percent}%"></div>
                        </div>
                    </div>
                </div>
            `;
        });
        document.getElementById('individual-list').innerHTML = html;
    }

    function generateTeams(users, isRandom, seed) {
        let pool = [...users].sort((a, b) => a.nume.localeCompare(b.nume));
        const teams = [];
        if (isRandom) {
            pool = seededShuffle(pool, seed);
            while(pool.length) {
                teams.push(pool.splice(0, 2));
                if(teams[teams.length-1].length === 1 && teams.length > 1) {
                    teams[teams.length-2].push(teams.pop()[0]);
                }
            }
        } else {
            pool.sort((a, b) => b.total - a.total);
            let left = 0, right = pool.length - 1;
            while(left < right) {
                teams.push([pool[left], pool[right]]);
                left++; right--;
            }
            if(left === right) {
                if(teams.length > 0) teams[teams.length-1].push(pool[left]);
                else teams.push([pool[left]]);
            }
        }
        return teams;
    }

    function seededShuffle(array, seed) {
        let m = array.length, t, i;
        const random = () => { var x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
        while (m) { i = Math.floor(random() * m--); t = array[m]; array[m] = array[i]; array[i] = t; }
        return array;
    }

    function getLastVerse(n) {
        if (n <= 0) return "Niciun verset";
        if (n <= 31) return `Ioan 14:${n}`;
        if (n <= 58) return `Ioan 15:${n - 31}`;
        if (n <= 91) return `Ioan 16:${n - 58}`;
        return "Finalizat";
    }

    // === COD ANTRENAMENT CU FIȘIERE .TXT ===

    // Aici vom salva textele după ce le descărcăm prima dată
    let BIBLE_TEXT = { 14: [], 15: [], 16: [] };
    let isTextLoaded = false;
    let currentMode = 'normal';
    let currentChapter = 14;

    // Funcția care descarcă fișierele .txt
    async function fetchBibleTexts() {
        const container = document.getElementById('antrenament-text');
        container.innerHTML = '<div class="loading">Se descarcă textele... <i class="ri-loader-4-line ri-spin"></i></div>';

        try {
            // Descărcăm toate cele 3 fișiere în același timp
            const [res14, res15, res16] = await Promise.all([
                fetch('ioan14.txt'),
                fetch('ioan15.txt'),
                fetch('ioan16.txt')
            ]);

            const [text14, text15, text16] = await Promise.all([
                res14.text(), res15.text(), res16.text()
            ]);

            // Împărțim textul pe rânduri (la fiecare Enter) și eliminăm rândurile goale
            BIBLE_TEXT[14] = text14.split('\n').filter(line => line.trim() !== '');
            BIBLE_TEXT[15] = text15.split('\n').filter(line => line.trim() !== '');
            BIBLE_TEXT[16] = text16.split('\n').filter(line => line.trim() !== '');

            isTextLoaded = true;
            renderText(); // Afișăm textul după ce s-a încărcat
        } catch (error) {
            console.error("Eroare la descărcarea textelor:", error);
            container.innerHTML = '<div style="color:#ef4444; padding:20px;">Eroare: Nu am putut găsi fișierele .txt. Verifică dacă se numesc ioan14.txt, ioan15.txt, ioan16.txt și dacă sunt în același folder cu index.html.</div>';
        }
    }

    window.openModal = async function() {
        document.getElementById('antrenament-modal').style.display = 'flex';

        // Dacă textele nu au fost deja descărcate, le descărcăm acum
        if (!isTextLoaded) {
            await fetchBibleTexts();
        } else {
            renderText();
        }
    };

    window.closeModal = function() {
        document.getElementById('antrenament-modal').style.display = 'none';
    };

    window.setMode = function(mode) {
        currentMode = mode;
        document.getElementById('btn-normal').classList.toggle('active', mode === 'normal');
        document.getElementById('btn-litere').classList.toggle('active', mode === 'litere');
        renderText();
    };

    window.setChapter = function(chapter) {
        currentChapter = chapter;

        [14, 15, 16].forEach(c => {
            const btn = document.getElementById(`btn-c${c}`);
            if(c === chapter) {
                btn.classList.add('active');
                btn.style.background = '#3b82f6';
            } else {
                btn.classList.remove('active');
                btn.style.background = 'transparent';
            }
        });

        renderText();
    };

    function transformToFirstLetter(text) {
        return text.replace(/\p{L}+/gu, function(word) {
            if(word.length === 1) return word;
            return word.charAt(0) + '_'.repeat(word.length - 1);
        });
    }

    function renderText() {
        if (!isTextLoaded) return; // Ne asigurăm că avem textul înainte să desenăm

        const container = document.getElementById('antrenament-text');
        let html = '';

        const chapterVerses = BIBLE_TEXT[currentChapter];

        chapterVerses.forEach((text, index) => {
            let verseNum = index + 1;
            let displayText = currentMode === 'litere' ? transformToFirstLetter(text) : text;

            html += `<div class="verse-block">
                        <span class="v-num" style="color:#facc15">${currentChapter}:${verseNum}</span>
                        <span>${displayText}</span>
                     </div>`;
        });

        container.innerHTML = html;
        document.getElementById('antrenament-text').scrollTop = 0;
    }
</script>
</body>
</html>
